<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>انتظرونا قريبًا</title>
    <style>
      :root {
        --bg: #07133a;
        --glow: #7ee7c4;
        --text: #eaf7ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
            800px 400px at 10% 10%,
            rgba(126, 231, 196, 0.06),
            transparent
          ),
          linear-gradient(180deg, #07133a, #021024);
        font-family: "Noto Kufi Arabic", "Segoe UI", Tahoma, system-ui,
          sans-serif;
        color: var(--text);
        padding: 20px;
      }

      .wrap {
        text-align: center;
        transform-origin: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 68px);
        letter-spacing: 1px;
        position: relative;
        display: inline-block;
        padding: 12px 28px;
        border-radius: 14px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6),
          0 0 30px rgba(126, 231, 196, 0.06);
        backdrop-filter: blur(6px);
        animation: pop 2.2s ease-in-out infinite;
      }

      /* glowing outline */
      h1::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 16px;
        background: radial-gradient(
          closest-side,
          rgba(126, 231, 196, 0.12),
          transparent 60%
        );
        filter: blur(12px);
        opacity: 0.9;
        z-index: -1;
        pointer-events: none;
        animation: glow 2.2s ease-in-out infinite;
      }

      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes glow {
        0% {
          opacity: 0.4;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
        100% {
          opacity: 0.4;
          transform: scale(0.98);
        }
      }

      /* reduce motion respect */
      @media (prefers-reduced-motion: reduce) {
        h1,
        h1::after {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="main" aria-label="انتظرونا قريبًا">
      <h1>انتظرونا قريبًا</h1>
    </div>
  </body>
</html>
